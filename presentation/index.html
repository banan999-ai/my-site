<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Движение Первых — презентация</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Manrope",system-ui,sans-serif;background:#0a1238;color:#fff;overflow:hidden;--c:#e3243b}
.bg{position:fixed;inset:0;background:radial-gradient(900px 600px at 85% -10%,color-mix(in srgb,var(--c) 55%,transparent),transparent 65%),radial-gradient(800px 600px at -10% 110%,#2b59d9aa,transparent 60%),#0a1238;transition:background 1s}
.star{position:fixed;font-size:120px;opacity:.06;animation:spin 40s linear infinite;pointer-events:none}.s1{right:4%;bottom:6%}.s2{left:3%;top:8%;font-size:70px;animation-direction:reverse}
.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:grid;align-items:center;padding:6vh 7vw 11vh;opacity:0;visibility:hidden;transform:translateX(var(--from,60px));transition:opacity .55s,transform .7s cubic-bezier(.2,.8,.2,1),visibility .55s}
.slide.on{opacity:1;visibility:visible;transform:none}.slide.out{--from:-60px}
h1,h2{font-family:"Unbounded",sans-serif;margin:0;letter-spacing:-.03em;line-height:1.08}
h1{font-size:clamp(34px,7vw,92px)}h2{font-size:clamp(26px,4.4vw,56px)}
p{font-size:clamp(16px,1.7vw,22px);line-height:1.55;color:rgba(255,255,255,.8);margin:18px 0 0;max-width:640px}
.tag{display:inline-block;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-weight:800;font-size:13px;letter-spacing:.06em}
.dir{grid-template-columns:1.05fr .95fr;gap:5vw}
.num{font-family:"Unbounded";font-weight:800;font-size:clamp(60px,10vw,140px);line-height:.9;color:transparent;-webkit-text-stroke:2px var(--c);opacity:.9}
ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px;max-width:600px}
li{padding:14px 18px 14px 50px;border-radius:16px;background:rgba(255,255,255,.08);position:relative;font-weight:600;font-size:clamp(14px,1.5vw,19px)}
li:before{content:"";position:absolute;left:18px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent)}
.slide.on li,.slide.on .rise{animation:rise .7s both cubic-bezier(.2,.8,.2,1)}.slide.on li:nth-child(1){animation-delay:.25s}.slide.on li:nth-child(2){animation-delay:.4s}.slide.on li:nth-child(3){animation-delay:.55s}
.photo{position:relative;aspect-ratio:4/3.3;border-radius:34px;overflow:hidden;background:linear-gradient(145deg,var(--c),#14265f);box-shadow:0 40px 90px rgba(0,0,0,.45);display:grid;place-items:center;transform:rotate(2deg);transition:transform .8s}
.slide.on .photo{transform:rotate(0);animation:pop .9s both cubic-bezier(.2,.8,.2,1) .15s}
.photo .ico{font-size:clamp(90px,14vw,190px);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.center{text-align:center;justify-items:center}.center p{margin-left:auto;margin-right:auto}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px;width:100%;max-width:980px}
.fact{padding:26px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}.fact b{display:block;font-family:"Unbounded";font-size:clamp(28px,4vw,52px);color:#ff6b81}.fact span{font-size:15px;color:rgba(255,255,255,.75)}
.grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px;width:100%;max-width:1060px}
.tile{cursor:pointer;padding:16px 14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;text-align:left;font:700 clamp(12px,1.3vw,16px)/1.25 Manrope;transition:.3s}
.tile:hover{background:var(--c);transform:translateY(-5px)}.tile i{display:block;font-style:normal;font-size:28px;margin-bottom:8px}
.slide.on .tile{animation:rise .6s both}
.nav{position:fixed;left:0;right:0;bottom:0;padding:18px 7vw 24px;display:flex;align-items:center;gap:18px;z-index:5}
.bar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e3243b,#2b59d9);transition:width .5s}
.cnt{font-weight:800;font-size:14px;min-width:54px;text-align:center}
.btn{width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;transition:.25s}.btn:hover{background:#fff;color:#0a1238;transform:scale(1.08)}
.home{position:fixed;top:18px;left:7vw;z-index:5;color:rgba(255,255,255,.7);font-weight:800;font-size:14px;text-decoration:none}.home:hover{color:#fff}
.photo:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 70% 30%,rgba(255,255,255,.12) 0 2px,transparent 2px 46px);opacity:.7}
.photo:after{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-15%;top:-25%;background:rgba(255,255,255,.14)}
.photo .ico{position:relative;z-index:2}.photo .e{position:absolute;z-index:2;font-size:clamp(34px,5vw,64px);animation:float 7s ease-in-out infinite;filter:drop-shadow(0 10px 16px rgba(0,0,0,.3))}.photo .e1{left:9%;bottom:10%;animation-delay:-2s}.photo .e2{right:10%;bottom:16%;animation-delay:-4s;font-size:clamp(28px,4vw,52px)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}@keyframes pop{from{opacity:0;transform:scale(.85) rotate(4deg)}}@keyframes float{50%{transform:translateY(-16px) rotate(4deg)}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.dir{grid-template-columns:1fr;gap:20px;align-content:center}.photo{order:-1;aspect-ratio:16/9;max-height:26vh}.num{display:none}.facts{grid-template-columns:1fr}.grid12{grid-template-columns:repeat(3,1fr)}.slide{padding:8vh 6vw 12vh;overflow:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bg"></div><span class="star s1">★</span><span class="star s2">★</span>
<a class="home" href="../pervye/">← К навигатору</a><div class="deck" id="deck"></div>
<div class="nav"><button class="btn" id="prev" aria-label="Назад">←</button><div class="bar"><i id="bar"></i></div><span class="cnt" id="cnt"></span><button class="btn" id="next" aria-label="Вперёд">→</button><button class="btn" id="fs" aria-label="Во весь экран">⛶</button></div>
<script>
const D=[["Образование и знания", "🎓", "#f5a623", "Развивает интерес к учёбе и самообразованию: помогает узнавать новое и делиться знаниями.", ["Олимпиады, викторины и интеллектуальные игры", "Проекты и «ребята учат ребят»", "Встречи с интересными людьми и образовательные события"], ["📚", "✏️"]], ["Наука и технологии", "🔬", "#2b9cf5", "Знакомит с наукой и современными технологиями и поддерживает юных исследователей.", ["Научные проекты и исследовательские работы", "Робототехника, программирование, IT", "Экскурсии в лаборатории и технопарки"], ["⚙️", "🧪"]], ["Труд, профессия и своё дело", "🛠", "#ff7a45", "Помогает понять, кем быть, и попробовать себя в разных профессиях.", ["Профориентационные игры и пробы профессий", "Экскурсии на предприятия", "Школьное предпринимательство и первые проекты"], ["👷", "💼"]], ["Культура и искусство", "🎭", "#c94bff", "Открывает творчество: от музыки и театра до традиций народов России.", ["Творческие конкурсы и фестивали", "Театр, музыка, танцы, рисование", "Знакомство с культурным наследием родного края"], ["🎨", "🎵"]], ["Волонтёрство и добровольчество", "🤝", "#ff4d6d", "Учит помогать другим и делать добрые дела вместе.", ["Помощь ветеранам и тем, кто нуждается", "Благотворительные и социальные акции", "Участие в организации мероприятий"], ["❤️", "🕊"]], ["Патриотизм и историческая память", "🎖", "#e3243b", "Сохраняет память о прошлом страны и воспитывает уважение к истории.", ["Встречи с ветеранами, акции памяти", "Изучение истории семьи и родного края", "Праздники и события государственного значения"], ["📜", "🏛"]], ["Спорт", "🏅", "#2ecc71", "Приучает к активной жизни, командной игре и честной борьбе.", ["Соревнования, турниры и спартакиады", "Подготовка к нормам ГТО", "Спортивные праздники и зарядки"], ["⚽", "🏆"]], ["Здоровый образ жизни", "🍎", "#7bd83f", "Формирует привычки, которые помогают заботиться о себе.", ["Беседы о питании, режиме дня и профилактике", "Челленджи и акции за здоровье", "Встречи со специалистами"], ["🥗", "🏃"]], ["Медиа и коммуникации", "🎬", "#00c2c7", "Учит рассказывать о важном: снимать, писать, вести блоги и школьные СМИ.", ["Школьные медиа, фото и видео", "Ведение соцсетей отделения", "Работа с текстом и публичные выступления"], ["📷", "🎙"]], ["Дипломатия и международное сотрудничество", "🌍", "#5b7cff", "Расширяет кругозор: знакомит с другими народами, странами и языками.", ["Встречи и культурный обмен", "Изучение языков и традиций разных народов", "Участие в международных проектах и форумах"], ["✈️", "🗣"]], ["Экология и охрана природы", "🌱", "#34c38f", "Воспитывает бережное отношение к природе и окружающей среде.", ["Уборка территорий и посадка деревьев", "Раздельный сбор и экологические уроки", "Защита природы родного края"], ["🌳", "♻️"]], ["Туризм и путешествия", "🧭", "#ffb020", "Открывает страну: походы, экскурсии и маршруты по родным местам.", ["Походы и экскурсионные поездки", "Краеведение и туристические маршруты", "Знакомство с достопримечательностями России"], ["⛺", "🗺"]]];
const K=4;
const S=[];
S.push(`<section class="slide center"><span class="tag rise">★ РОССИЙСКОЕ ДВИЖЕНИЕ ДЕТЕЙ И МОЛОДЁЖИ</span><h1 style="margin-top:22px">Движение<br>Первых</h1><p class="rise">12 направлений, в которых каждый может найти своё. Короткая презентация для педагогов и родителей.</p></section>`);
S.push(`<section class="slide center"><h2>Что это за движение</h2><p>Общественно-государственное движение детей и молодёжи. Участие добровольное, а каждый может выбрать то, что ему интересно.</p><div class="facts"><div class="fact"><b>2022</b><span>год создания. Идею предложила школьница из Севастополя Диана Красовская</span></div><div class="fact"><b>6–25</b><span>лет — возраст участников</span></div><div class="fact"><b>12</b><span>направлений деятельности</span></div></div></section>`);
S.push(`<section class="slide center"><h2>Миссия: быть первыми</h2><p>Движение объединяет ребят вокруг общих ценностей и добрых дел.</p><div class="facts"><div class="fact"><b style="font-size:clamp(20px,2.6vw,32px)">Быть с Россией</b><span>Любить страну и знать её историю</span></div><div class="fact"><b style="font-size:clamp(20px,2.6vw,32px)">Быть человеком</b><span>Дружба, доброта, взаимопомощь</span></div><div class="fact"><b style="font-size:clamp(20px,2.6vw,32px)">Быть вместе</b><span>Команда и общие дела в Движении</span></div></div></section>`);
S.push(`<section class="slide center"><h2>12 направлений</h2><p>Нажмите на любое, чтобы перейти к нему.</p><div class="grid12">${D.map((d,i)=>`<button class="tile" style="--c:${d[2]};animation-delay:${.1+i*.05}s" onclick="go(${K+i})"><i>${d[1]}</i>${d[0]}</button>`).join("")}</div></section>`);
D.forEach((d,i)=>S.push(`<section class="slide dir" style="--c:${d[2]}"><div><div class="num">${String(i+1).padStart(2,"0")}</div><h2>${d[0]}</h2><p>${d[3]}</p><ul>${d[4].map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="photo"><span class="ico">${d[1]}</span><span class="e e1">${d[5][0]}</span><span class="e e2">${d[5][1]}</span><img src="photos/${String(i+1).padStart(2,"0")}.jpg" alt="${d[0]}" onerror="this.remove()"></div></section>`));
S.push(`<section class="slide center"><h2>Как присоединиться</h2><p>Найдите первичное отделение в своей школе и обратитесь к его руководителю. Подробные шаги — в навигаторе.</p><div class="facts"><div class="fact"><b style="font-size:clamp(20px,2.6vw,32px)">1. Отделение</b><span>Узнайте, есть ли оно в школе</span></div><div class="fact"><b style="font-size:clamp(20px,2.6vw,32px)">2. Регистрация</b><span>Создайте профиль на официальном сайте</span></div><div class="fact"><b style="font-size:clamp(20px,2.6vw,32px)">3. Направление</b><span>Выберите то, что по душе</span></div></div><p><a href="../pervye/" style="color:#ff8ea0;font-weight:800">Открыть инструкции →</a></p></section>`);
const deck=document.getElementById('deck');deck.innerHTML=S.join('');const els=[...deck.children];let cur=-1;
function go(n){n=Math.max(0,Math.min(els.length-1,n));if(n===cur)return;
  els.forEach((e,i)=>{e.classList.toggle('out',i<n);e.classList.toggle('on',i===n)});
  cur=n;document.getElementById('bar').style.width=((n+1)/els.length*100)+'%';document.getElementById('cnt').textContent=(n+1)+' / '+els.length;
  const c=els[n].style.getPropertyValue('--c')||'#e3243b';document.body.style.setProperty('--c',c);history.replaceState(null,'','#'+(n+1))}
document.getElementById('next').onclick=()=>go(cur+1);document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(cur-1);if(e.key==='Home')go(0);if(e.key==='End')go(els.length-1);if(e.key==='f')document.getElementById('fs').click()});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(cur+(d<0?1:-1));x0=null});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
